type: object
description: Root schema with oneOf array variant property
properties:
  plainProp:
    type: string
    description: Arbitrary plain property
  oneOfProp:
    oneOf:
      - type: string
        description: String oneOf variant (unchanged)
      - type: number
        description: Number oneOf variant (unchanged)
      - type: array
        description: Array with homogeneous object items schema (no indexed items)
        items:
          type: object
          description: Sample object schema with all object validations
          properties:
            name:
              type: string
            id:
              type: integer
          default:
            name: sample
            id: 1
          minProperties: 1
          maxProperties: 5
        minItems: 0
        maxItems: 10
        uniqueItems: true

